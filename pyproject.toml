[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcbias"
version = "1.0.0"
description = "Benchmark of learned and model-based DC-bias controllers for DCO-OFDM LiFi under LED model error and device shift"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "threadpoolctl>=3.5",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["dcbias"]

[tool.setuptools.package-data]
dcbias = ["config.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
